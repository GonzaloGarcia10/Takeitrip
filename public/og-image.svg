<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#gradient)" opacity="0.5"/>
  
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Logo circle -->
  <circle cx="600" cy="250" r="80" fill="url(#logoGradient)"/>
  <defs>
    <linearGradient id="logoGradient" x1="520" y1="170" x2="680" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Plane icon -->
  <path d="M600 220 L640 260 L620 265 L605 290 L595 270 L580 275 L600 220Z" fill="white"/>
  
  <!-- Title -->
  <text x="600" y="400" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Takeitrip</text>
  
  <!-- Subtitle -->
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="24" fill="#a1a1aa" text-anchor="middle">Recomendaciones de Hoteles con IA</text>
  
  <!-- Decorative dots -->
  <circle cx="200" cy="150" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="250" cy="200" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="1000" cy="180" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="950" cy="130" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="150" cy="500" r="4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="1050" cy="480" r="4" fill="#ec4899" opacity="0.6"/>
</svg>